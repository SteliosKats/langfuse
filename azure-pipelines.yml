# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: Docker@2
  inputs:
    containerRegistry: 'EurolifeAKSProdRegistry-AKS_Charts'
    repository: 'langfuse-web'
    command: 'buildAndPush'
    Dockerfile: '**/web/Dockerfile'
    tags: 'v3.180.0'
    arguments: '--build-arg NODE_ENV=production --build-arg NEXT_PUBLIC_BASE_PATH=/trace'    
